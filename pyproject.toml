[build-system]
requires = ["uv_build>=0.11.19,<0.12"]
build-backend = "uv_build"

[project]
name = "survjax"
version = "0.0.1.dev0"
description = "Survival analysis in JAX"
requires-python = ">=3.12"
license = "Apache-2.0"
license-files = ["LICENSE"]
authors = [{ name = "Wouter A.C. van Amsterdam" }]
dependencies = ["jax>=0.11.2", "numpy>=2.5.3"]

[dependency-groups]
examples = [
    "optimistix==0.1.0",
    "matplotlib==3.11.2",
    "equinox==0.13.8",
    "optax==0.2.8",
    "numpyro==0.22.0",
    "pandas==3.1.0",
]
test = [
    "pytest>=9.1.1",
    "mpmath>=1.4.1",
    "hypothesis>=6.168.1",
    "pytest-xdist>=3.8.0",
]
dev = [
    { include-group = "test" },
    "ruff>=0.16.9",
    "mypy>=2.3.1",
    "pre-commit>=4.6.2",
]
docs = [
    "furo>=2025.12.19",
    "ipykernel>=7.4.0",
    "jupyterlab>=4.6.4",
    "matplotlib>=3.11.2",
    "myst-nb>=1.4.0",
    "sphinx>=9.1.0",
]

[tool.ruff]
line-length = 88
extend-exclude = ["spec"]

[tool.ruff.lint]
select = ["E", "W", "F", "I", "B", "C4", "UP"]
ignore = ["E501"]

# The tutorial notebooks keep their reader-facing layout: their setup cells
# configure the environment and make the example package importable before
# importing it, and their lines are not rewrapped.
[tool.ruff.lint.per-file-ignores]
"examples/survival_mnist/survival-mnist.ipynb" = ["E402"]
"examples/bayesian_rmst/bayesian-rmst.ipynb" = ["E402"]

[tool.ruff.format]
exclude = [
    "examples/survival_mnist/survival-mnist.ipynb",
    "examples/bayesian_rmst/bayesian-rmst.ipynb",
]

[tool.mypy]
files = ["src"]
check_untyped_defs = true

[tool.pytest.ini_options]
markers = [
    "gpu: test applies to an optional JAX GPU backend verification run",
    "slow: listed in tests/slow_tests.txt; skipped by the fast gate (-m 'not slow')",
]
