name: CPU CI

# Tier 2 (every push to main, every PR): Linux and macOS, the full suite, one
# job per dtype mode. Tier 3 (weekly, or manual with full_matrix): Windows too.
on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: "17 3 * * 1"
  workflow_dispatch:
    inputs:
      full_matrix:
        description: "Include Windows (tier 3)"
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: cpu-${{ github.workflow }}-${{ github.ref }}-${{ github.event_name }}
  cancel-in-progress: true

jobs:
  # The weekly run skips the matrix when main has not moved since the last
  # successful weekly run (a skipped run also counts, for the same commit).
  plan:
    name: Plan
    runs-on: ubuntu-24.04
    permissions:
      actions: read
    outputs:
      run: ${{ steps.plan.outputs.run }}
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
      - id: plan
        env:
          GH_TOKEN: ${{ github.token }}
        run: bash scripts/ci_plan.sh

  # Every hook in .pre-commit-config.yaml, once, on every file (prek, locked in
  # uv.lock). The matrix waits for it.
  hooks:
    needs: plan
    if: needs.plan.outputs.run == 'true'
    name: Hooks (prek)
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      UV_LOCKED: "true"
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          version: "0.11.19"
          python-version: "3.12"
          enable-cache: true
      - run: uv sync --locked --group dev
      - run: uv run prek run --all-files --show-diff-on-failure

  check:
    needs: [plan, hooks]
    if: needs.plan.outputs.run == 'true'
    name: CPU / ${{ matrix.os }} / x64=${{ matrix.x64 }} / Python 3.12
    runs-on: ${{ matrix.os }}
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        os: ${{ fromJSON((github.event_name == 'schedule' || inputs.full_matrix) && '["ubuntu-24.04","macos-15","windows-2022"]' || '["ubuntu-24.04","macos-15"]') }}
        x64: ["1", "0"]
    defaults:
      run:
        shell: bash
    env:
      JAX_PLATFORMS: cpu
      PYTEST_WORKERS: "2"
      SURVJAX_X64_MODES: ${{ matrix.x64 }}
      SURVJAX_JAX_CACHE: ${{ github.workspace }}/.jax-cache
      UV_LOCKED: "true"
    steps:
      - name: Keep shell scripts in LF format on checkout
        run: |
          git config --global core.autocrlf false
          git config --global core.eol lf
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Prepare branch references for the protected-path guard
        env:
          CI_SOURCE_BRANCH: ${{ github.head_ref }}
        run: bash scripts/ci_branch_refs.sh
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          version: "0.11.19"
          python-version: "3.12"
          enable-cache: true
      - name: Install locked dependencies and build wheel
        run: |
          uv sync --locked --group dev
          uv build --wheel
      - name: Record wheel and CPU environment
        run: uv run python scripts/ci_environment.py
      - name: Restore the JAX compilation cache
        uses: actions/cache@v4
        with:
          path: .jax-cache
          key: jax-${{ runner.os }}-x64${{ matrix.x64 }}-${{ hashFiles('uv.lock') }}-${{ github.run_id }}
          restore-keys: |
            jax-${{ runner.os }}-x64${{ matrix.x64 }}-${{ hashFiles('uv.lock') }}-
      - name: Run all gates through A12 in this dtype mode
        env:
          UV_OFFLINE: "1"
          UV_PYTHON_DOWNLOADS: never
        run: bash scripts/check.sh
