name: GPU CI

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  gpu:
    name: GPU / Modal T4
    runs-on: ubuntu-24.04
    timeout-minutes: 360
    steps:
      - name: Check out the selected commit
        uses: actions/checkout@v5
        with:
          ref: ${{ github.sha }}
          persist-credentials: false

      - name: Install uv
        uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          version: "0.11.19"
          python-version: "3.12"
          enable-cache: true

      - name: Run GPU tests on Modal
        env:
          MODAL_TOKEN_ID: ${{ secrets.MODAL_TOKEN_ID }}
          MODAL_TOKEN_SECRET: ${{ secrets.MODAL_TOKEN_SECRET }}
          TMPDIR: ${{ runner.temp }}
        run: uvx --from modal==1.6.3 modal run scripts/gpu_ci.py --max-runtime-hours 5 --max-cost-usd 10

      - name: Upload Modal results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: gpu-results-${{ github.sha }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/survjax-gpu-*.zip
          if-no-files-found: warn
          retention-days: 90

      - name: Summarize tested commit
        if: always()
        env:
          JOB_RESULT: ${{ job.status }}
          TESTED_REF: ${{ github.ref }}
          TESTED_SHA: ${{ github.sha }}
        run: |
          {
            echo "## Modal GPU CI"
            echo
            echo "- Result: **${JOB_RESULT}**"
            echo "- Ref: \`${TESTED_REF}\`"
            echo "- Commit: [\`${TESTED_SHA}\`](${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/commit/${TESTED_SHA})"
            echo "- Run: [${GITHUB_RUN_ID}](${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID})"
          } >> "$GITHUB_STEP_SUMMARY"
