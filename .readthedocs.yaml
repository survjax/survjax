# Custom jobs preserve the executable, both-dtype pipeline and locked groups.
# https://docs.readthedocs.com/platform/stable/build-customization.html
version: 2

build:
  os: ubuntu-24.04
  tools:
    python: "3.12"
  jobs:
    create_environment:
      - python -m pip install uv==0.11.19
      # Expose the pip-installed console script through RTD's asdf shims.
      - asdf reshim python
    install:
      - uv sync --locked --group docs --group examples
    build:
      html:
        - scripts/build_docs.sh
        # Publish one complete site, only after both dtype builds succeed.
        - mkdir -p "$READTHEDOCS_OUTPUT/html"
        - cp -a docs/_build/html-x64/. "$READTHEDOCS_OUTPUT/html/"
